<div class="map-root" #hostEl>
  <canvas #canvasEl class="seat-canvas"></canvas>

  <!-- Info-only tooltip anchored to seat -->
  <div class="tt"
       *ngIf="tooltip"
       [style.left.px]="tooltip.x"
       [style.top.px]="tooltip.y"
       [class.tt--below]="!tooltip.above"
       role="tooltip">

    <div class="tt-arrow"></div>

    <div class="tt-top">
      <span class="tt-price" [style.color]="getSeatFill(tooltip.seat)">{{ fmt(tooltip.seat.price) }}</span>
      <span class="tt-badge"
            [class.avail]="isAvail(tooltip.seat)"
            [class.sel]="isSel(tooltip.seat)"
            [class.unavail]="isUnavail(tooltip.seat)"
            [class.taken]="isTaken(tooltip.seat) && !isUnavail(tooltip.seat)">
        {{ isSel(tooltip.seat) ? '✓ Selected' : getStatusText(tooltip.seat) }}
      </span>
    </div>

    <div class="tt-info" *ngIf="!tooltip.seat.isStandingArea">
      {{ tooltip.seat.sectionName }} &middot; Row <strong>{{ tooltip.seat.rowLabel }}</strong> &middot; Seat <strong>{{ tooltip.seat.seatNumber }}</strong>
    </div>
    <div class="tt-info" *ngIf="tooltip.seat.isStandingArea">
      {{ tooltip.seat.sectionName }} &middot; General admission
    </div>
  </div>
</div>
