<mat-sidenav
  [opened]="isOpen"
  mode="side"
  class="sidebar"
  [class.sidebar-collapsed]="!isOpen"
  [class.mobile-sidebar]="isMobile">

  <div class="sidebar-content">
    <nav class="sidebar-nav">
      <mat-nav-list class="nav-list">

        <a *ngFor="let item of visibleNavigationItems"
           mat-list-item
           [routerLink]="getNavLink(item)"
           class="nav-item"
           [class.active]="isNavActive(item)"
           [class.nav-disabled]="isNavDisabled(item)"
           [matTooltip]="getNavTooltip(item)"
           matTooltipPosition="right">

          <mat-icon matListItemIcon class="nav-icon">{{ item.icon }}</mat-icon>

          <span matListItemTitle class="nav-label">
            {{ item.label }}
            <span *ngIf="item.badge && isOpen" class="nav-badge">{{ item.badge }}</span>
          </span>

          <div *ngIf="!isOpen && item.badge" matListItemMeta class="nav-badge-mini">
            {{ item.badge }}
          </div>
        </a>

      </mat-nav-list>
    </nav>

    <!-- Footer -->
    <div class="sidebar-footer" *ngIf="isOpen">
      <mat-divider></mat-divider>
      <div class="footer-content">
        <div class="copyright">
          <div class="copyright-content">
            <span class="copyright-text">&copy; {{ currentYear }} devance.co.uk. All rights reserved.</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</mat-sidenav>
